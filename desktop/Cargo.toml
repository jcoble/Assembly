[package]
name = "assembly-desktop"
version = "0.1.43"
edition = "2024"
publish = false

[dependencies]
async-process = "=2.5.0"
open = "=5.4.5"
futures-channel = "=0.3.34"
gpui-kit = { version = "=0.9.0", features = ["profiler", "syntect", "gpui-fast"] }
wry = { package = "lb-wry", version = "=0.53.3", features = ["transparent"] }
rust-embed = "=8.13.0"
mime_guess = "=2.0.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
alacritty_terminal = "=0.26.0"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
percent-encoding = "=2.3.2"
tungstenite = "=0.27.0"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAppearance", "NSView"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSKeyValueCoding", "NSString", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "=0.18.5"
gdk = "=0.18.2"
gdkx11 = "=0.18.2"
gtk = "=0.18.2"
raw-window-handle = "=0.6.2"

[dev-dependencies]
futures-executor = "=0.3.34"
gpui = { package = "gpui-fast", version = "=0.1.13", features = ["test-support"] }
