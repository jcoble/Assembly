[package]
name = "assembly-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures-channel = "=0.3.34"
gpui-kit = "=0.8.1"
gpui-fps = "=0.8.1"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
base64 = "=0.22.1"
libghostty-vt = { version = "=0.2.2", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tungstenite = "=0.27.0"

[dev-dependencies]
futures-executor = "=0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

# Ghostty's parser is built by Zig in Debug mode for a debug build, which is too slow to keep up with a busy terminal.
[profile.dev.package.libghostty-vt-sys]
debug = false
opt-level = 3
