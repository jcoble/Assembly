[package]
name = "assembly-desktop"
version = "0.1.14"
edition = "2024"
publish = false

[dependencies]
async-process = "=2.5.0"
open = "=5.4.5"
futures-channel = "=0.3.34"
gpui-kit = { version = "=0.9.0", features = ["profiler", "syntect"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
alacritty_terminal = "=0.26.0"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
percent-encoding = "=2.3.2"
tungstenite = "=0.27.0"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
futures-executor = "=0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
