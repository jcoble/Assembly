[package]
name = "assembly-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.8.1"
gpui-fps = "=0.8.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tungstenite = "=0.27.0"
