[package]
name = "assembly-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1.0"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
