# On a pull request marked ready, every push to main and a manual dispatch (a draft runs only the commit check): the
# backend builds with no warnings and its tests pass, the window (desktop/) builds, tests and passes clippy, every
# retained scripts/*.test.sh passes, lint passes, and (on a pull request) each of its own commits passes
# scripts/check-commit-msg.sh. A change with nothing for the backend skips its job (scripts/ci-changes.ts); these are
# job conditions, not path filters, so a skipped job still reports success to a required check.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
# A new push to a pull request cancels its run still going; each main commit gets its own run, never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.jobs.outputs.full }}
      backend: ${{ steps.jobs.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: jobs
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.ts
  dotnet:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build
  desktop:
    # The GPUI window (desktop/README.md): is formatted, builds, tests and passes clippy with warnings denied. Its guard
    # runs in lint.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
      # Installs the toolchain and components desktop/rust-toolchain.toml names.
      - run: rustup toolchain install
      # The .debs, so a slow mirror only costs apt-get update. Keyed on this file, which holds the package list.
      - uses: actions/cache@v4
        with:
          path: ~/.apt-archives
          key: apt-desktop-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-desktop-${{ runner.os }}-
      - name: Install GPUI's Linux build dependencies
        timeout-minutes: 10
        run: |
          mkdir -p ~/.apt-archives/partial
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dir::Cache::Archives=$HOME/.apt-archives install -y build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev clang cmake
          sudo chown -R "$USER" ~/.apt-archives
      # The socket tests against the real backend start this build's binary (core/socket/real_backend.rs). With
      # ASSEMBLY_REAL_BACKEND set, a backend that isn't built fails them rather than letting them pass empty.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ../dotnet/Assembly.Desktop/Assembly.Desktop.csproj
      - run: cargo build --locked
      - run: cargo test --locked
        env:
          ASSEMBLY_REAL_BACKEND: "1"
      - name: Native launcher shutdown timing
        run: bash ../scripts/shutdown-timing.test.sh
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Last and always, so unformatted code reports here without stopping the tests above.
      - name: cargo fmt --check
        if: ${{ !cancelled() }}
        run: cargo fmt --check
  scripts:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PR verifier behavior
        run: node --test scripts/verify-pr/*.test.ts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Hook integrity behavior
        run: node --test scripts/hooks/*.test.ts
      - name: Agent runbook behavior
        run: node --test scripts/agent-runbook/runbook.test.ts
      - name: Every scripts/*.test.ts passes
        if: ${{ !cancelled() }}
        run: node --test scripts/*.test.ts
      - name: Every scripts/*.test.sh passes
        run: |
          failed=0
          # shutdown-timing.test.sh runs in the desktop job with its Rust toolchain and native dependencies, and
          # remote-cli.test.sh below, since its build can rewrite a lock file and lint-checks.test.sh needs a clean tree.
          for t in scripts/*.test.sh; do
            [ "$t" = scripts/shutdown-timing.test.sh ] && continue
            [ "$t" = scripts/remote-cli.test.sh ] && continue
            echo "== $t"
            bash "$t" || failed=1
          done
          exit $failed
      - name: The remote CLI's arguments
        if: ${{ !cancelled() }}
        run: |
          dotnet build dotnet/Assembly.Remote/Assembly.Remote.csproj
          bash scripts/remote-cli.test.sh
  lint:
    # scripts/lint.sh runs the retained script checks and native desktop guard; its .NET checks need dotnet.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/lint.sh
  commits:
    # A pull request's own commits; pushes to main aren't checked, since agent work reaches main through a pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Each commit's message passes scripts/check-commit-msg.sh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          failed=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            scripts/check-commit-msg.sh --commit "$c" "$BRANCH" || { echo "in $(git log -1 --format='%h %s' "$c")"; failed=1; }
          done
          exit $failed
