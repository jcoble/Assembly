# On every pull request and every push to main (a lane branch's push runs once, as its pull request): the backend
# builds with no warnings and its tests pass, the app checks, tests and builds, the shell checks and tests, the window
# (desktop/) builds, tests and passes clippy, every scripts/*.test.sh passes, the app's guards and lint pass, and (on a
# pull request) each of its own commits passes scripts/check-commit-msg.sh.
name: ci
on:
  push:
    branches: [main]
  pull_request:
# A new push to a pull request cancels its run still going; each main commit gets its own run, never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@11.5.1 && pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      # The .debs, so a slow mirror only costs apt-get update. Keyed on this file, which holds the package list.
      - uses: actions/cache@v4
        with:
          path: ~/.apt-archives
          key: apt-shell-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-shell-${{ runner.os }}-
      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          mkdir -p ~/.apt-archives/partial
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dir::Cache::Archives=$HOME/.apt-archives install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          sudo chown -R "$USER" ~/.apt-archives
      # Tauri's build reads the page's folder and the bundled backend's at compile time; the app and dotnet jobs
      # build the real ones.
      - run: mkdir -p ../app/build backend
      - run: cargo check --locked
      - run: cargo test --locked
  desktop:
    # The GPUI window (desktop/README.md): is formatted, builds, tests and passes clippy with warnings denied. Its guard
    # runs in lint.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
      # Installs the toolchain and components desktop/rust-toolchain.toml names.
      - run: rustup toolchain install
      - run: cargo fmt --check
      # The .debs, so a slow mirror only costs apt-get update. Keyed on this file, which holds the package list.
      - uses: actions/cache@v4
        with:
          path: ~/.apt-archives
          key: apt-desktop-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-desktop-${{ runner.os }}-
      - name: Install GPUI's Linux build dependencies
        timeout-minutes: 10
        run: |
          mkdir -p ~/.apt-archives/partial
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Dir::Cache::Archives=$HOME/.apt-archives install -y build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev clang cmake
          sudo chown -R "$USER" ~/.apt-archives
      # The socket tests against the real backend start this build's binary (core/socket/real_backend.rs). With
      # ASSEMBLY_REAL_BACKEND set, a backend that isn't built fails them rather than letting them pass empty.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ../dotnet/Assembly.Desktop/Assembly.Desktop.csproj
      - run: cargo build --locked
      - run: cargo test --locked
        env:
          ASSEMBLY_REAL_BACKEND: "1"
      - run: cargo clippy --locked --all-targets -- -D warnings
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Every scripts/*.test.sh passes
        run: |
          failed=0
          for t in scripts/*.test.sh; do echo "== $t"; bash "$t" || failed=1; done
          exit $failed
  lint:
    # The app's guards and scripts/lint.sh. They read the checkout, not its history; lint.sh's .NET checks need dotnet.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash app/scripts/guards.sh
      - run: bash scripts/lint.sh
  commits:
    # A pull request's own commits; pushes to main aren't checked, since agent work reaches main through a pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Each commit's message passes scripts/check-commit-msg.sh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          failed=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            scripts/check-commit-msg.sh --commit "$c" "$BRANCH" || { echo "in $(git log -1 --format='%h %s' "$c")"; failed=1; }
          done
          exit $failed
