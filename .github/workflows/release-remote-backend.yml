name: Release Assembly Remote Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'scripts/remote-backend-release*'
      - 'scripts/backend-release-version*'
      - 'scripts/package-adapters.ts'
      - '.github/workflows/release-remote-backend.yml'
    tags:
      - 'assembly-backend-v*'

concurrency:
  group: assembly-remote-backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/assembly-backend-v'))
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Select backend version
        id: release
        run: node scripts/backend-release-version.ts

      - name: Verify package contracts
        run: node --test scripts/backend-release-version.test.ts scripts/remote-backend-release.test.ts

      - name: Build remote backend package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dotnet publish dotnet/Assembly.Remote -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:NuGetLockFilePath=obj/release.packages.lock.json \
            "-p:SourceRevisionId=$GITHUB_SHA" -o "$RUNNER_TEMP/remote-publish"
          node scripts/remote-backend-release.ts "$VERSION" "$RUNNER_TEMP/remote-publish/Assembly.Remote" remote-backend-release

      - name: Publish signed remote backend package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARCHIVE=$(find remote-backend-release -type f -name '*.tar.gz' -print -quit)
          test -n "$ARCHIVE"
          npm exec --yes --package=@tauri-apps/cli@2.11.2 -- tauri signer sign "$ARCHIVE"
          npm exec --yes --package=@tauri-apps/cli@2.11.2 -- tauri signer sign "$ARCHIVE.download.json"
          gh release create "$RELEASE_TAG" --draft --latest=false --target "$GITHUB_SHA" \
            --title "Assembly Remote Backend v$VERSION" \
            --notes "Download the signed Assembly remote backend package for Linux x86-64."
          gh release upload "$RELEASE_TAG" remote-backend-release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
