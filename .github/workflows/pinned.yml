# Fails a push to main that changes or deletes a pinned test without Jesse's OK (scripts/check-pinned.sh).
name: pinned tests
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No unapproved changes to pinned tests
        run: |
          before=${{ github.event.before }}
          if [ "$before" = 0000000000000000000000000000000000000000 ]; then before=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          scripts/check-pinned.sh "$before" "${{ github.sha }}"
